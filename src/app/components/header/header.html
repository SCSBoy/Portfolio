<mat-toolbar class="header" [class.header--scrolled]="scrolled()" [class.header--inverse]="inverse()">
  <a class="header__logo" routerLink="/" (click)="handleNavClick($event, '/')">C.E</a>
  <span class="header__spacer"></span>

  <nav class="header__nav">
    @for (link of links; track link.key) {
      <a mat-button [routerLink]="link.path" [fragment]="link.fragment" (click)="handleNavClick($event, link.path, link.fragment)">{{ i18n.t(link.key) }}</a>
    }
    <a mat-flat-button color="primary" routerLink="/details" fragment="contact" (click)="handleNavClick($event, '/details', 'contact')">{{ i18n.t('nav.contact') }}</a>

    <div class="header__controls">
      <button mat-button (click)="i18n.toggleLanguage()" class="lang-btn" [attr.aria-label]="i18n.t('nav.switch_lang')">
        <mat-icon class="lang-btn__icon" aria-hidden="true">language</mat-icon>
        <span class="lang-btn__code">{{ i18n.currentLang() | uppercase }}</span>
      </button>

      <button
        mat-icon-button
        class="theme-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="i18n.t(theme.isDark() ? 'nav.theme_light' : 'nav.theme_dark')"
        [attr.title]="i18n.t(theme.isDark() ? 'nav.theme_light' : 'nav.theme_dark')">
        <mat-icon class="theme-btn__icon" aria-hidden="true">{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </div>
  </nav>

  <button
    class="header__menu-trigger"
    mat-icon-button
    [matMenuTriggerFor]="mobileMenu"
    [attr.aria-label]="i18n.t('nav.menu_open')"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #mobileMenu="matMenu">
    @for (link of links; track link.key) {
      <a mat-menu-item [routerLink]="link.path" [fragment]="link.fragment" (click)="handleNavClick($event, link.path, link.fragment)">{{ i18n.t(link.key) }}</a>
    }
    <a mat-menu-item routerLink="/details" fragment="contact" (click)="handleNavClick($event, '/details', 'contact')">{{ i18n.t('nav.contact') }}</a>
    <button mat-menu-item (click)="i18n.toggleLanguage()">
      <mat-icon>language</mat-icon>
      <span>{{ i18n.t('nav.switch_lang') }}</span>
    </button>
    <button mat-menu-item (click)="theme.toggle()">
      <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      <span>{{ i18n.t(theme.isDark() ? 'nav.theme_light' : 'nav.theme_dark') }}</span>
    </button>
  </mat-menu>
</mat-toolbar>
