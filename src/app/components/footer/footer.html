<footer class="footer">
  <!-- Extrême gauche: Image -->
  <div class="footer__left">
    <img src="images/CHARLY_BYE.png" alt="Charly Bye" class="footer__character" loading="lazy">
  </div>

  <!-- Milieu: Designed by + Logo + Copyright -->
  <div class="footer__center">
    <div class="footer__branding">
      <span>{{ i18n.t('footer.designed_by') }} Charly EKLU</span>
      <img src="images/LOGO C.E.png" alt="Logo C.E." class="footer__logo" loading="lazy">
    </div>
    <p class="footer__copy">© {{ year }} Charly EKLU. {{ i18n.t('footer.rights') }}</p>
  </div>

  <!-- Extrême droite: Réseaux sociaux -->
  <div class="footer__right">
    <div class="footer__socials">
      @for (social of socials; track social.label) {
        <a mat-button [href]="social.href" target="_blank" rel="noopener noreferrer" class="footer__social-link">
          <mat-icon>{{ social.icon }}</mat-icon>
          <span>{{ social.label }}</span>
        </a>
      }
    </div>
  </div>
</footer>
