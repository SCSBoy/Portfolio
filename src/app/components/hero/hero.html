<section id="accueil" class="hero">

  <!-- Vidéo de fond en boucle, sans son -->
  <video
    class="hero__bg-video"
    #bgVideo
    [muted]="true"
    autoplay
    loop
    playsinline
    aria-hidden="true"
    preload="auto"
  >
    <source src="videos/BG_vid.mp4" type="video/mp4" />
  </video>

  <!-- ── Colonne gauche : Panel flottant ── -->
  <div class="hero__content" #contentPanel>
    <button class="hero__close-btn" mat-icon-button
      (click)="collapseToBadge()" [attr.aria-label]="i18n.t('hero.aria_collapse')">
      <mat-icon>close</mat-icon>
    </button>
    <p class="hero__eyebrow">
      {{ i18n.t('hero.eyebrow') }} <span #typedRole class="hero__typed"></span>
    </p>
    <h1 class="hero__title">
      {{ i18n.t('hero.title_hi') }} <span class="hero__title-accent">{{ i18n.t('hero.name_hi') }}</span>
    </h1>
    <div class="hero__actions">
      <a mat-flat-button color="primary" href="documents/CV-EKLU Charly Yayra.pdf" target="_blank" rel="noopener noreferrer">
        <mat-icon iconPositionEnd>download</mat-icon>
        {{ i18n.t('hero.btn_resume') }}
      </a>
      <button mat-stroked-button (click)="toggleVideoMode()">
        <mat-icon>{{ isVideoMode() ? 'photo_camera' : 'play_circle' }}</mat-icon>
        {{ isVideoMode() ? i18n.t('hero.btn_return_photo') : i18n.t('hero.btn_video') }}
      </button>
    </div>
  </div>

  <!-- ── Colonne droite : Portrait (toujours visible) ── -->
  <div class="hero__portrait" appReveal="right">
    <div class="hero__hex-wrap" [class.is-video-mode]="isVideoMode()" #hexWrap>
      <div class="hero__hexagon" #hexagon>
        @if (!isVideoMode() && !imgError()) {
          <button
            class="hero__profile-open"
            mat-icon-button
            (click)="openProfileViewer(); $event.stopPropagation()"
            [attr.aria-label]="i18n.currentLang() === 'en' ? 'Open profile photo' : 'Ouvrir la photo de profil'">
            <mat-icon>fullscreen</mat-icon>
          </button>
        }

        <!-- Photo (always in DOM, crossfades out) -->
        <img src="images/ME_portfolio.png" alt="Photo de Charly Eklu"
             class="hero__presentation-media hero__presentation-img"
             [class.is-hidden]="isVideoMode()"
             (error)="imgError.set(true)" />

        <!-- Fallback if img errors -->
        @if (imgError()) {
          <div class="hero__hexagon-fallback" [class.is-hidden]="isVideoMode()">
            <mat-icon>person</mat-icon>
          </div>
        }

        <!-- Video (always in DOM, crossfades in) -->
        <video class="hero__presentation-media hero__presentation-video"
               [class.is-active]="isVideoMode()"
               controls
               preload="none"
               [autoplay]="isVideoMode()">
          <source src="videos/BG_vid.mp4" type="video/mp4" />
        </video>
      </div>

      <!-- Badge "!" — toujours dans le DOM, animé par JS -->
      <button class="hero__badge" #badgeBtn
        (click)="expandToPanel()"
        [attr.aria-label]="i18n.t('hero.aria_expand')">
        <span class="hero__badge-text">!</span>
      </button>

      <span class="hero__tag hero__tag--1" aria-hidden="true">&lt;div&gt;</span>
      <span class="hero__tag hero__tag--2" aria-hidden="true">&lt;/&gt;</span>
      <span class="hero__tag hero__tag--3" aria-hidden="true">&#123; &#125;</span>
      <span class="hero__tag hero__tag--4" aria-hidden="true">&lt;h1/&gt;</span>
    </div>

    <div class="hero__tagline-card">
      <p class="hero__tagline" #taglineEl>
        {{ i18n.t('hero.tagline') }}
      </p>
    </div>
  </div>

  <a class="hero__scroll-cue" href="#a-propos" [attr.aria-label]="i18n.t('hero.aria_scroll_next')">
    <mat-icon>keyboard_arrow_down</mat-icon>
  </a>

  @if (profileViewerOpen()) {
    <div
      class="profile-viewer"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="i18n.currentLang() === 'en' ? 'Profile photo' : 'Photo de profil'"
      (click)="closeProfileViewer()">
      <button
        class="profile-viewer__close"
        mat-icon-button
        (click)="closeProfileViewer(); $event.stopPropagation()"
        [attr.aria-label]="i18n.currentLang() === 'en' ? 'Close profile photo' : 'Fermer la photo de profil'">
        <mat-icon>close</mat-icon>
      </button>
      <figure class="profile-viewer__figure" (click)="$event.stopPropagation()">
        <img
          class="profile-viewer__image"
          src="images/ME_portfolio.png"
          alt="Photo de Charly Eklu" />
      </figure>
    </div>
  }
</section>
